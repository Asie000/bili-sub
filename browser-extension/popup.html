<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>bili-sub 桥接</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 15px; }
    label { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    input[type="number"] { width: 72px; }
    button { padding: 4px 10px; cursor: pointer; }
    #status { margin: 10px 0 0; word-break: break-all; }
    #status.ok { color: #2e7d32; }
    #status.err { color: #c62828; }
    p.hint { margin: 8px 0 0; opacity: 0.7; font-size: 12px; }
  </style>
</head>
<body>
  <h1>bili-sub 桥接</h1>
  <label>本地端口 <input id="port" type="number" min="1" max="65535" value="8080"></label>
  <button id="send" type="button">重新发送</button>
  <p id="status">正在发送…</p>
  <p class="hint">Cookie 只发往本机 localhost，不会上传到任何服务器。</p>
  <script src="popup.js"></script>
</body>
</html>
