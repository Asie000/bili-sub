<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bili-sub 字幕采集</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>bili-sub 字幕采集</h1>
  <div id="login-status" class="status">登录状态：未设置 SESSDATA</div>
</header>

<div id="progress-panel" class="progress-panel" hidden>
  <span id="progress-label" class="progress-label"></span>
  <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
</div>

<main>
  <section class="panel login-panel">
    <h2>登录 / Cookie</h2>
    <input id="sessdata" type="password" autocomplete="off" placeholder="粘贴 SESSDATA 或完整 Cookie">
    <button id="save-sessdata">保存登录信息</button>
    <button id="qr-login">扫码登录</button>
    <p class="hint">从 B站页面 F12 → 网络 → 任意请求 → 请求头 Cookie，整段复制（推荐，能避免 412）。</p>
    <div id="qr-area" class="qr-area" hidden>
      <img id="qr-img" alt="登录二维码" width="240" height="240">
      <div id="qr-status" class="hint"></div>
    </div>
  </section>

  <section class="panel">
    <h2>一键获取当前链接（书签小工具）</h2>
    <p class="hint">把下面的按钮拖到浏览器书签栏。以后在 B站 任意视频 / 空间 / 收藏夹页面点它一下，就会自动把当前链接发到这里开始探测。</p>
    <p><a id="bookmarklet" class="bookmarklet" href="#">拖我到书签栏</a></p>
  </section>

  <section class="panel">
    <h2>来源</h2>
    <div class="row">
      <select id="kind">
        <option value="">自动识别</option>
        <option value="single">单个视频</option>
        <option value="space">UP主主页</option>
        <option value="fav">收藏夹</option>
      </select>
      <input id="url" type="text" placeholder="视频 / UP主空间 / 收藏夹 链接">
      <button id="probe">探测</button>
      <label class="checkbox"><input type="checkbox" id="show-all"> 显示全部来源</label>
    </div>
    <div class="row">
      <label for="lang">字幕语言</label>
      <select id="lang">
        <option value="">默认</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
      </select>
      <label class="checkbox"><input id="transcribe" type="checkbox"> 无字幕时转写</label>
      <button id="download">获取字幕</button>
      <button id="export">导出</button>
      <button id="refresh">刷新</button>
      <button id="clear">清空</button>
    </div>
    <div class="row" id="export-formats">
      <span class="hint">导出格式（可多选）</span>
      <label class="checkbox"><input class="export-format" type="checkbox" value="srt" checked> srt</label>
      <label class="checkbox"><input class="export-format" type="checkbox" value="txt"> txt</label>
      <label class="checkbox"><input class="export-format" type="checkbox" value="json"> json</label>
      <label class="checkbox"><input class="export-format" type="checkbox" value="md"> md</label>
      <span id="export-hint" class="hint"></span>
    </div>
  </section>

  <section class="panel">
    <h2>视频列表 <span id="stats" class="hint"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>序号</th><th>标题</th><th>作者</th><th>发布日期</th>
            <th>字幕状态</th><th>字幕语言</th><th>是否充电</th>
          </tr>
        </thead>
        <tbody id="videos-body"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>进度</h2>
    <pre id="log" class="log"></pre>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
