[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-sub-py"
version = "0.1.0"
description = "B站 subtitle collection and local faster-whisper ASR pipeline (Python port of bili-sub)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "segno>=1.5",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2",
    "av<19",
]
dev = [
    "pytest>=8",
]

[project.scripts]
bili-sub-py = "bili_sub.cli:main"

[tool.setuptools.packages.find]
include = ["bili_sub*"]

[tool.setuptools.package-data]
bili_sub = ["asr/data/*.json", "server/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
